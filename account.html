<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>マイページ | SORA SELECT</title><style>
:root{--green:#435a4b;--line:#e6e5df;--bg:#faf9f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;color:#2a332e}header{padding:18px max(16px,calc((100vw - 1000px)/2));background:white;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;align-items:center}header b{letter-spacing:.15em;font-size:20px}a{color:var(--green)}main{max-width:1000px;margin:32px auto;padding:0 15px}.card{background:white;border:1px solid var(--line);padding:26px;border-radius:13px;margin:18px 0}h1{font-size:25px}h2{font-size:19px}label{display:block;margin:12px 0 5px;font-size:13px;font-weight:700}input{padding:12px;width:100%;border:1px solid #ccc;border-radius:7px;font:inherit}button{padding:11px 17px;background:var(--green);color:white;border:0;border-radius:7px;font:inherit;cursor:pointer}button.secondary{background:#e8eee9;color:#344e40}.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:220px}.hidden{display:none!important}.muted{color:#69736c;font-size:13px;line-height:1.8}.message{white-space:pre-wrap;line-height:1.7}.order{padding:18px 0;border-top:1px solid var(--line)}.order:first-of-type{border-top:0}.badge{background:#e9eee8;color:#425d4a;padding:4px 9px;border-radius:30px;font-size:12px}.code{overflow-wrap:anywhere;background:#f3f6f2;padding:9px;border-radius:7px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.detail{padding:10px;background:#f8f8f6;border-radius:6px;margin:9px 0;white-space:pre-wrap}.tabs{display:flex;gap:8px}.tabs button{flex:1}.favorite{display:flex;justify-content:space-between;gap:12px;align-items:center;border-top:1px solid var(--line);padding:14px 0}
</style></head><body><header><b>SORA SELECT</b><a href="index.html">← 商品一覧に戻る</a></header><main><h1>マイページ</h1><p class="muted">注文履歴・お気に入り・カートを確認できます。登録済みメールでログインしてください。</p>
<section class="card" id="authCard"><div class="tabs"><button type="button" id="loginTab">ログイン</button><button type="button" class="secondary" id="registerTab">新規会員登録</button></div><form id="authForm"><label>メールアドレス<input type="email" id="email" autocomplete="email" required></label><label>パスワード（6文字以上）<input type="password" id="password" minlength="6" autocomplete="current-password" required></label><button type="submit" id="authSubmit">ログイン</button></form><p class="message" id="authMsg" role="status"></p><button class="secondary" id="forgot" type="button">パスワードを忘れた方</button><p class="muted">新規登録ではメール認証が必要な設定の場合、届いた確認メールから認証してください。パスワードはこのサイトで保存しません。</p></section>
<div id="profile" class="hidden"><section class="card"><div style="display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap"><div><h2>アカウント</h2><p id="accountEmail"></p></div><button id="logout" class="secondary">ログアウト</button></div><div class="row"><div><label>新しいパスワード（6文字以上）<input id="newPassword" type="password" minlength="6" autocomplete="new-password"></label><button id="updatePassword" type="button" class="secondary">パスワードを変更</button></div></div><p id="profileMsg" class="message" role="status"></p></section>
<section class="card"><h2>🏠 お届け先の保存</h2><p class="muted">ここで保存すると、ログイン後の注文時に入力欄へ反映されます。</p><form id="profileForm"><label>お名前<input id="customerName" maxlength="100"></label><label>電話番号<input id="customerPhone" maxlength="30"></label><label>郵便番号<input id="customerPost" maxlength="12"></label><label>お届け先住所<input id="customerAddress" maxlength="500"></label><button type="submit">お届け先を保存</button><p id="addressMsg" class="message"></p></form></section>
<section class="card"><h2>📦 注文履歴</h2><p class="muted">ログイン中にご注文された履歴が表示されます。以前のゲスト注文は自動では紐づきません。</p><div id="orders">読み込み中…</div></section>
<section class="card"><h2>♡ お気に入り</h2><div id="favorites">読み込み中…</div></section>
<section class="card"><h2>🛒 保存されたカート</h2><div id="cart">読み込み中…</div><div class="actions"><a href="index.html">お買い物を続ける →</a></div></section></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase?.createClient('https://canzmrjdfmkfzvillfvj.supabase.co','sb_publishable_0dNqymu9o1YoLCZbY9o8iA_A3_2ZFQJ');
const $=id=>document.getElementById(id),yen=n=>'¥'+Number(n).toLocaleString('ja-JP');let registering=false,user=null,recoveryMode=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMode(v){registering=v;$('authSubmit').textContent=v?'会員登録':'ログイン';$('loginTab').className=v?'secondary':'';$('registerTab').className=v?'':'secondary';$('password').autocomplete=v?'new-password':'current-password';$('authMsg').textContent=''}
$('loginTab').onclick=()=>setMode(false);$('registerTab').onclick=()=>setMode(true);
$('authForm').onsubmit=async e=>{e.preventDefault();if(!db)return;$('authSubmit').disabled=true;const email=$('email').value.trim(),password=$('password').value;try{if(registering){const {error}=await db.auth.signUp({email,password,options:{emailRedirectTo:new URL('account.html',location.href).href}});if(error)throw error;$('authMsg').textContent='登録を受け付けました。確認メールが届いた場合は、メール内のリンクを開いてからログインしてください。'}else{const {error}=await db.auth.signInWithPassword({email,password});if(error)throw error;await init()}}catch(e){$('authMsg').textContent='エラー: '+e.message}finally{$('authSubmit').disabled=false}};
$('forgot').onclick=async()=>{const email=$('email').value.trim();if(!email)return $('authMsg').textContent='まずメールアドレスを入力してください。';const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:new URL('account.html',location.href).href});$('authMsg').textContent=error?'エラー: '+error.message:'再設定メールを送信しました。届いたメールをご確認ください。'};
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};
$('updatePassword').onclick=async()=>{const password=$('newPassword').value;if(password.length<6){$('profileMsg').textContent='パスワードは6文字以上にしてください。';return}const {error}=await db.auth.updateUser({password});$('profileMsg').textContent=error?'変更できませんでした: '+error.message:'パスワードを変更しました ✓';if(!error)$('newPassword').value=''};

$('profileForm').onsubmit=async e=>{e.preventDefault();if(!user)return;const payload={user_id:user.id,customer_name:$('customerName').value.trim(),phone:$('customerPhone').value.trim(),postal_code:$('customerPost').value.trim(),shipping_address:$('customerAddress').value.trim(),updated_at:new Date().toISOString()};const {error}=await db.from('customer_profiles').upsert(payload);$('addressMsg').textContent=error?'保存できませんでした: '+error.message:'保存しました ✓'};
async function loadProfile(){const {data,error}=await db.from('customer_profiles').select('customer_name,phone,postal_code,shipping_address').eq('user_id',user.id).maybeSingle();if(error)return;for(const [key,id] of [['customer_name','customerName'],['phone','customerPhone'],['postal_code','customerPost'],['shipping_address','customerAddress']])$(id).value=data?.[key]||''}

function addText(parent,text,tag='div'){const el=document.createElement(tag);el.textContent=text;parent.append(el);return el}
async function loadOrders(){const holder=$('orders');holder.textContent='読み込み中…';const {data,error}=await db.from('orders').select('id,created_at,status,quoted_total_yen').eq('user_id',user.id).order('created_at',{ascending:false}).limit(100);if(error){holder.textContent='注文履歴を読み込めません: '+error.message;return}if(!data?.length){holder.textContent='まだ注文履歴がありません。';return}const {data:items,error:err}=await db.from('order_items').select('order_id,product_id,quantity,unit_price_yen,variant_label,variant_key').in('order_id',data.map(o=>o.id));const {data:ps}=await db.from('products').select('id,name');const names=new Map((ps||[]).map(p=>[String(p.id),p.name]));const statuses={pending:'確認待ち',quoted:'お見積り済み',awaiting_payment:'お支払い待ち',paid:'お支払い確認済み',shipped:'発送済み',completed:'お取引完了',cancelled:'キャンセル'};holder.replaceChildren();for(const o of data){const box=document.createElement('article');box.className='order';const h=addText(box,'注文 '+o.id.slice(0,8),'strong');const badge=addText(box,' '+(statuses[o.status]||o.status),'span');badge.className='badge';addText(box,new Date(o.created_at).toLocaleString('ja-JP'),'p').className='muted';const code=addText(box,o.id);code.className='code';const copy=document.createElement('button');copy.textContent='注文番号をコピー';copy.className='secondary';copy.onclick=async()=>{try{await navigator.clipboard.writeText(o.id);copy.textContent='コピーしました ✓'}catch(e){prompt('注文番号',o.id)}};box.append(copy);if(err)addText(box,'明細読み込みエラー: '+err.message);else for(const i of (items||[]).filter(x=>x.order_id===o.id)){const name=names.get(String(i.product_id))||'商品ID: '+i.product_id;const row=addText(box,name+(i.variant_label?' / '+i.variant_label:'')+' × '+i.quantity+' · '+yen(i.unit_price_yen*i.quantity));row.className='detail'}if(o.quoted_total_yen!=null)addText(box,'見積合計：'+yen(o.quoted_total_yen),'strong');const repeat=document.createElement('button');repeat.className='secondary';repeat.textContent='再注文（カートに入れる）';repeat.style.marginTop='10px';repeat.onclick=async()=>{const old=(items||[]).filter(x=>x.order_id===o.id),key='sora_select_cart_v2';let saved=[];try{saved=JSON.parse(localStorage.getItem(key)||'[]');if(!Array.isArray(saved))saved=[]}catch(e){}for(const x of old){if(!(ps||[]).some(p=>String(p.id)===String(x.product_id)))continue;const k=saved.find(a=>String(a.product_id)===String(x.product_id)&&String(a.variant_key||'')===String(x.variant_key||''));if(k)k.quantity=Math.min(20,k.quantity+x.quantity);else saved.push({product_id:String(x.product_id),variant_key:x.variant_key||'',quantity:Math.min(20,x.quantity)})}localStorage.setItem(key,JSON.stringify(saved));const {error}=await db.from('customer_carts').upsert({user_id:user.id,items:saved,updated_at:new Date().toISOString()});if(error){alert('カートの同期に失敗しました。');return}location.href='index.html'};if(!err)box.append(repeat);holder.append(box)}}
async function loadFavorites(){const holder=$('favorites');holder.textContent='読み込み中…';const {data,error}=await db.from('customer_favorites').select('product_id').eq('user_id',user.id);if(error){holder.textContent=error.message;return}if(!data?.length){holder.textContent='お気に入りはまだありません。';return}const {data:ps}=await db.from('products').select('id,name,price_yen').in('id',data.map(x=>x.product_id));holder.replaceChildren();for(const f of data){const p=(ps||[]).find(x=>String(x.id)===String(f.product_id));const row=document.createElement('div');row.className='favorite';const a=document.createElement('a');a.href='index.html#product='+encodeURIComponent(f.product_id);a.textContent=(p?.name||'商品')+' · '+(p?yen(p.price_yen):'');const del=document.createElement('button');del.className='secondary';del.textContent='解除';del.onclick=async()=>{const {error}=await db.from('customer_favorites').delete().eq('user_id',user.id).eq('product_id',f.product_id);if(!error)row.remove()};row.append(a,del);holder.append(row)}}
async function loadCart(){const holder=$('cart');const {data,error}=await db.from('customer_carts').select('items').eq('user_id',user.id).maybeSingle();if(error){holder.textContent=error.message;return}const items=data?.items||[];if(!items.length){holder.textContent='カートは空です。';return}const {data:ps}=await db.from('products').select('id,name');holder.replaceChildren();for(const line of items){const p=(ps||[]).find(x=>String(x.id)===String(line.product_id));addText(holder,(p?.name||'商品')+' · 数量 '+line.quantity+' · 規格 '+(line.variant_key||'標準'))}}
db?.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){recoveryMode=true;init().then(()=>{if(user){$('profileMsg').textContent='新しいパスワードを入力して「パスワードを変更」を押してください。';$('newPassword').focus()}})}});
async function init(){if(!db){$('authMsg').textContent='Supabaseを読み込めませんでした。';return}const {data:{user:u}}=await db.auth.getUser();user=u;if(!u){$('authCard').classList.remove('hidden');$('profile').classList.add('hidden');return}$('authCard').classList.add('hidden');$('profile').classList.remove('hidden');$('accountEmail').textContent=u.email;if(recoveryMode)$('profileMsg').textContent='新しいパスワードを入力して「パスワードを変更」を押してください。';await Promise.all([loadOrders(),loadFavorites(),loadCart(),loadProfile()])}
init();
</script></body></html>

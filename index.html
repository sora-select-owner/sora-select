<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sora Select</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f8f8f8;
      color: #222;
    }
    header {
      background: #fff;
      padding: 24px;
      text-align: center;
      border-bottom: 1px solid #ddd;
    }
    h1 { margin: 0; letter-spacing: 2px; }
    main { padding: 40px 20px; text-align: center; }
    .card {
      background: white;
      padding: 32px;
      border-radius: 16px;
      max-width: 420px;
      margin: 24px auto;
    }
  </style>
</head>
<body>
  <header><h1>SORA SELECT</h1></header>
  <main>
    <h2>あなたの暮らしに、いいものを。</h2>
    <p>毎日の生活をもっと便利に。</p>
    <div class="card">
      <h3>商品一覧</h3>
      <p>商品はまもなく公開予定です。</p>
    </div>
  </main>
</body>
</html>
